services:
  server:
    build: .
    init: true  # forwards SIGTERM so `docker compose down` stops the server at once
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data:ro
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      HTTP_THREADS: ${HTTP_THREADS:-32}
    depends_on:
      ollama:
        condition: service_started  # /api/health answers 200 while the model is loading

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: 1  # one generation at a time; the server queues requests
      OLLAMA_KEEP_ALIVE: 30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20

  # One-shot container: downloads the model once (kept in the volume) and exits.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:1b}"]
    restart: "no"

volumes:
  ollama_models: